# Security response headers for the built SPA (dist/).
# Include this inside your `server { ... }` block, or the `location / { ... }`
# block serving index.html. A <meta> CSP tag (already in index.html) cannot
# set these — they only work as real HTTP response headers.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Only enable HSTS once you're fully committed to HTTPS everywhere (including subdomains, if applicable):
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Keep this in sync with the <meta http-equiv="Content-Security-Policy"> in index.html.
# frame-ancestors only takes effect via a real header (browsers ignore it in <meta>).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://YOUR-API-DOMAIN; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
